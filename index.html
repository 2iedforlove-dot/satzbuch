<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0a0908">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Satzbuch</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
:root{
  --bg:#0a0908; --surface:#15120f; --surface2:#1f1a16; --line:#2b241f;
  --text:#f5efe7; --muted:#9d9389; --faint:#62594f;
  --accent:#ff6a2b; --accent-ink:#1c0800; --accent-soft:rgba(255,106,43,.11); --danger:#ff4f4f;
  --sand:#e4c9a6; --sand-soft:rgba(228,201,166,.1);
  --serif:"Instrument Serif", ui-serif, Georgia, "Times New Roman", serif;
  --r:18px; --pad:16px;
  --font: ui-sans-serif, -apple-system, "SF Pro Text", "Segoe UI Variable Text", "Segoe UI", Roboto, system-ui, sans-serif;
  --display: ui-sans-serif, -apple-system, "SF Pro Display", "Segoe UI Variable Display", "Segoe UI", Roboto, system-ui, sans-serif;
  color-scheme: dark;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{background:var(--bg);color:var(--text);font:15px/1.4 var(--font);-webkit-font-smoothing:antialiased}
body{min-height:100dvh;overscroll-behavior-y:none}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
input{font:inherit;color:inherit}
a{color:inherit}
.num{font-variant-numeric:tabular-nums}
#app{max-width:520px;margin:0 auto;padding:calc(env(safe-area-inset-top) + 12px) var(--pad) calc(env(safe-area-inset-bottom) + 170px)}

/* Kopf */
.top{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;padding:12px 0 20px}
.top.sub{align-items:center}
.eyebrow{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600}
h1{font:700 34px/1.05 var(--display);letter-spacing:-.02em}
.top.sub h1{font-size:22px;letter-spacing:-.01em;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;text-align:center}
.iconbtn{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;background:var(--surface);flex:none;transition:transform .15s}
.iconbtn:active{transform:scale(.92)}
.iconbtn svg{width:20px;height:20px}

.card{background:var(--surface);border-radius:var(--r);padding:18px}
.section{display:flex;justify-content:space-between;align-items:baseline;font-size:13px;font-weight:650;color:var(--muted);letter-spacing:.04em;text-transform:uppercase;margin:28px 2px 10px}
.up{color:var(--accent)} .flat{color:var(--faint)} .down{color:var(--muted)}

/* Wochenleiste im Plan */
.wstrip{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}
.wd{display:grid;gap:6px;justify-items:center;min-width:0}
.wd .l{font-size:11px;font-weight:650;color:var(--faint)}
.wd.now .l{color:var(--text)}
.wd .t{width:100%;min-height:54px;border-radius:12px;background:var(--surface);display:grid;place-content:center;gap:1px;text-align:center;font-size:11px;font-weight:700;color:var(--muted);padding:4px 1px;line-height:1.15;overflow:hidden}
.wd .t small{font-size:9.5px;font-weight:650;opacity:.85}
.wd .t.rest{color:var(--faint);font-weight:600}
.wd .t.gym{color:var(--accent);background:var(--accent-soft)}
.wd .t.done{background:var(--accent);color:var(--accent-ink)}
.wd.now .t{box-shadow:inset 0 0 0 1.5px var(--text)}

.todaycard{margin-top:12px;display:grid;gap:10px}
.todaycard h2{font:700 22px/1.15 var(--display);letter-spacing:-.01em}
.tline{display:flex;align-items:center;gap:10px;font-size:15px;color:var(--muted)}
.tline b{color:var(--text);font-weight:650}
.tdot{width:8px;height:8px;border-radius:50%;background:var(--faint);flex:none}
.tdot.gym{background:var(--accent)}
.tdot.la{background:#8fb3ff} .tdot.tennis{background:#e9d36f} .tdot.x{background:var(--sand)}
.smallbtn{justify-self:start;height:40px;padding:0 16px;border-radius:12px;background:var(--accent);color:var(--accent-ink);font-weight:750;font-size:14px}

/* Trainings */
.wk{padding:0;overflow:hidden;margin-bottom:10px}
.wk-head{width:100%;display:flex;align-items:center;gap:14px;padding:16px 16px 16px 14px;text-align:left}
.wk-tag{width:44px;height:44px;border-radius:13px;background:var(--surface2);display:grid;place-items:center;font:800 18px var(--display);color:var(--accent);flex:none}
.wk-head h3{font:700 18px/1.15 var(--display);letter-spacing:-.01em}
.wk-head .meta{font-size:13px;color:var(--muted);margin-top:2px}
.wk-head .chev{margin-left:auto;color:var(--faint);transition:transform .25s;flex:none}
.wk-head .chev svg{width:20px;height:20px;display:block}
.wk.open .chev{transform:rotate(180deg)}
.wk-body{display:none;padding:0 10px 10px}
.wk.open .wk-body{display:block}
.wk-note{font-size:13px;color:var(--muted);padding:0 6px 10px;line-height:1.45}
.wk-note b{color:var(--text);font-weight:650}
.slot{display:grid;grid-template-columns:1fr auto;background:var(--surface2);border-radius:14px;margin-top:6px;overflow:hidden}
.slot-main{display:grid;grid-template-columns:26px 1fr auto;gap:12px;align-items:center;text-align:left;padding:12px 6px 12px 12px;min-width:0;transition:background .15s}
.slot-main:active{background:var(--line)}
.slot-n{width:26px;height:26px;border-radius:50%;background:var(--line);display:grid;place-items:center;font-size:12px;font-weight:750;color:var(--muted)}
.slot-n.ok{background:var(--accent);color:var(--accent-ink)}
.slot-n svg{width:14px;height:14px}
.slot-t{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--faint);font-weight:650}
.slot-name{font-weight:650;font-size:15.5px;line-height:1.25;margin-top:1px}
.slot-ziel{font-size:12.5px;color:var(--muted);margin-top:1px}
.ready{display:inline-flex;align-items:center;gap:5px;margin-top:5px;font-size:11.5px;font-weight:750;color:var(--accent)}
.ready::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--accent)}
.slot-auf{font-size:11.5px;color:var(--faint);margin-top:3px;font-weight:600}
.slot-auf b{color:var(--muted);font-weight:650}
/* Progressionsleiter */
.prog{background:var(--surface);border-radius:14px;padding:12px 12px 11px;margin-top:10px}
.prog-top{display:flex;justify-content:space-between;align-items:baseline;gap:10px;font-size:11px;font-weight:750;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.prog-top .num{letter-spacing:0;color:var(--text);font-size:12px}
.rungs{display:flex;flex-wrap:wrap;align-items:center;gap:5px 4px;margin-top:9px}
.rungs::-webkit-scrollbar{display:none}
.rung{flex:none;font-size:12px;font-weight:650;padding:5px 9px;border-radius:9px;background:var(--surface2);color:var(--faint);white-space:nowrap}
.rung.done{color:var(--muted)}
.rung.done::before{content:"✓ ";color:var(--accent)}
.rung.cur{background:var(--accent);color:var(--accent-ink)}
.rung.nx{color:var(--text);box-shadow:inset 0 0 0 1.5px var(--accent)}
.rungs .ar{flex:none;color:var(--faint);font-size:11px}
.prog-bar{height:5px;border-radius:3px;background:var(--surface2);margin-top:10px;overflow:hidden}
.prog-bar i{display:block;height:100%;background:var(--accent);border-radius:3px;transition:width .3s}
.prog p{font-size:12.5px;color:var(--muted);margin-top:8px;line-height:1.4}
.prog p b{color:var(--text);font-weight:650}
.prog.win{box-shadow:inset 0 0 0 1.5px var(--accent)}
.slot-cnt{font-size:13px;font-weight:700;color:var(--muted);padding-right:4px}
.swap{width:46px;display:grid;place-items:center;color:var(--muted);border-left:1px solid var(--line)}
.swap:active{background:var(--line)}
.swap svg{width:18px;height:18px}
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;background:var(--surface);border-radius:12px;padding:3px;margin-bottom:10px}
.seg button{padding:8px 4px;border-radius:9px;font-size:13px;font-weight:600;color:var(--muted);transition:background .2s,color .2s}
.seg button.on{background:var(--surface2);color:var(--text)}
.wk .seg{background:var(--bg);margin:0 0 10px}
.wk .seg button.on{background:var(--surface2)}
.rules{display:grid;gap:12px;font-size:14px;color:var(--muted);line-height:1.45}
.rules b{color:var(--text)}

/* Übungsliste */
.list{list-style:none;display:grid;gap:8px}
.row{display:grid;grid-template-columns:1fr auto;align-items:center;gap:12px;width:100%;text-align:left;background:var(--surface);border-radius:var(--r);padding:14px 16px;transition:transform .15s,background .15s}
.row:active{transform:scale(.985);background:var(--surface2)}
.row .name{font-weight:650;font-size:16px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .meta{color:var(--muted);font-size:13px;margin-top:2px}
.row .meta b{color:var(--text);font-weight:600}
.row .right{display:flex;align-items:center;gap:12px}
.spark{width:64px;height:28px;display:block}
.delta{font-size:13px;font-weight:650;min-width:44px;text-align:right}

.empty{text-align:center;padding:48px 24px 24px;color:var(--muted)}
.empty .glyph{width:64px;height:64px;margin:0 auto 18px;border-radius:20px;background:var(--surface);display:grid;place-items:center}
.empty h2{color:var(--text);font:650 20px/1.2 var(--display);margin-bottom:6px}
.linkbtn{color:var(--accent);font-weight:600;margin-top:16px;padding:8px 12px}

/* Statistik */
.streak{display:grid;grid-template-columns:1fr auto;align-items:center;gap:16px}
.streak .big{font:700 52px/1 var(--display);letter-spacing:-.035em;margin-top:6px}
.streak .big small{font-size:16px;font-weight:600;color:var(--muted);letter-spacing:0;margin-left:6px}
.streak .sub{font-size:13px;color:var(--muted);margin-top:6px}
.ring{position:relative;width:86px;height:86px}
.ring svg{width:86px;height:86px;transform:rotate(-90deg)}
.ring div{position:absolute;inset:0;display:grid;place-content:center;text-align:center}
.ring b{font:700 22px/1 var(--display)}
.ring span{font-size:10.5px;color:var(--muted);font-weight:600;margin-top:3px}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px}
.tile{background:var(--surface);border-radius:var(--r);padding:14px 16px}
.tile b{display:block;font:700 26px/1.1 var(--display);letter-spacing:-.02em;margin-top:6px}
.tile b small{font-size:14px;color:var(--muted);font-weight:600;margin-left:3px;letter-spacing:0}
.chartcard{padding:16px 14px 10px}
.chartcard svg{width:100%;height:auto;display:block}
.heat{display:grid;grid-template-columns:auto 1fr;gap:8px;align-items:stretch}
.heat-l{display:grid;grid-template-rows:repeat(7,1fr);gap:4px;font-size:10px;color:var(--faint);font-weight:600}
.heat-l span{display:flex;align-items:center}
.heat-g{display:grid;grid-template-rows:repeat(7,1fr);grid-auto-flow:column;grid-auto-columns:1fr;gap:4px}
.heat-g i{aspect-ratio:1;border-radius:4px;background:var(--surface2)}
.heat-g i.l1{background:rgba(255,106,43,.28)} .heat-g i.l2{background:rgba(255,106,43,.55)} .heat-g i.l3{background:var(--accent)}
.heat-g i.fut{background:transparent}
.heat-g i.now{box-shadow:0 0 0 1.5px var(--text)}
.split{display:grid;gap:12px}
.split-row{display:grid;grid-template-columns:72px 1fr 54px;align-items:center;gap:10px;font-size:14px}
.split-row .bar{height:8px;border-radius:4px;background:var(--surface2);overflow:hidden}
.split-row .bar i{display:block;height:100%;border-radius:4px;background:var(--accent)}
.split-row .v{text-align:right;font-weight:650}
.split-row .v small{color:var(--faint);font-weight:600}
.prs{display:grid;gap:0}
.pr-row{display:grid;grid-template-columns:1fr auto;gap:12px;align-items:center;text-align:left;padding:12px 16px;width:100%}
.pr-row + .pr-row{border-top:1px solid var(--line)}
.pr-row .n{font-weight:650}
.pr-row .d{font-size:13px;color:var(--muted)}

/* Detail */
.hero{padding:4px 2px 18px}
.hero .big{font:700 56px/1 var(--display);letter-spacing:-.035em;margin:8px 0 6px}
.hero .big span{font-size:20px;color:var(--muted);font-weight:600;letter-spacing:0;margin-left:4px}
.hero .sub{color:var(--muted);font-size:14px}
.chart{padding:14px 12px 8px}
.readout{display:flex;justify-content:space-between;font-size:13px;color:var(--muted);padding:0 4px 6px;min-height:22px}
.readout b{color:var(--text);font-weight:650}
.chart svg{width:100%;height:auto;display:block;touch-action:pan-y}
.session{margin-bottom:10px;padding:6px 0}
.session-head{display:flex;justify-content:space-between;padding:10px 16px 4px;font-size:13px;color:var(--muted);font-weight:600}
.set{display:grid;grid-template-columns:28px 1fr auto 32px;align-items:center;padding:9px 8px 9px 16px;font-size:16px}
.set + .set{border-top:1px solid var(--line)}
.set .n{color:var(--faint);font-size:13px;font-weight:600}
.set .x{color:var(--muted);margin:0 3px}
.del{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;color:var(--faint)}
.del:active{background:var(--surface2);color:var(--danger)}
.del svg{width:16px;height:16px}
.pr{font-size:11px;font-weight:800;letter-spacing:.06em;color:var(--accent-ink);background:var(--accent);padding:3px 7px;border-radius:6px}
.planlink{display:flex;gap:10px;align-items:center;font-size:13px;color:var(--muted);padding:0 2px 16px}
.planlink b{color:var(--text);font-weight:650}

/* Tab-Leiste und Hauptknopf */
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:6;background:rgba(10,9,8,.82);-webkit-backdrop-filter:blur(18px);backdrop-filter:blur(18px);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
.tabbar-in{max-width:520px;margin:0 auto;display:grid;grid-template-columns:repeat(3,1fr)}
.tab{display:grid;justify-items:center;gap:3px;padding:9px 0 8px;font-size:11px;font-weight:650;color:var(--faint);transition:color .15s}
.tab svg{width:23px;height:23px}
.tab.on{color:var(--text)}
.fab{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom) + 78px);height:56px;padding:0 26px 0 20px;border-radius:28px;background:var(--accent);color:var(--accent-ink);font-weight:700;font-size:16px;display:flex;align-items:center;gap:8px;box-shadow:0 10px 34px rgba(255,90,31,.35),0 2px 8px rgba(0,0,0,.5);transition:transform .15s;z-index:5}
.fab:active{transform:translateX(-50%) scale(.95)}
.fab svg{width:22px;height:22px}

/* Sheet */
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.6);opacity:0;pointer-events:none;transition:opacity .25s;z-index:10}
.scrim.open{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:0;right:0;bottom:0;margin:0 auto;max-width:520px;max-height:92dvh;overflow:auto;background:#110e0c;border-radius:26px 26px 0 0;border-top:1px solid rgba(255,240,225,.06);padding:10px var(--pad) calc(env(safe-area-inset-bottom) + 18px);transform:translateY(105%);transition:transform .32s cubic-bezier(.2,.9,.25,1);z-index:11;overscroll-behavior:contain}
.sheet.open{transform:none}
.grab{width:38px;height:5px;border-radius:3px;background:var(--line);margin:0 auto 14px}
.sheet-head{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:14px}
.sheet-head h2{font:700 22px/1.1 var(--display)}
.sheet-head p{font-size:13px;color:var(--muted);margin-top:3px}
.field{width:100%;background:var(--surface);border:1.5px solid transparent;border-radius:14px;padding:14px 16px;font-size:17px;font-weight:600;outline:none;transition:border-color .15s}
.field:focus{border-color:var(--accent)}
.field::placeholder{color:var(--faint);font-weight:500}
.chips{display:flex;gap:8px;overflow-x:auto;padding:10px var(--pad) 2px;scrollbar-width:none;margin:0 calc(var(--pad) * -1)}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;padding:8px 14px;border-radius:20px;background:var(--surface);font-size:14px;font-weight:600;color:var(--muted);white-space:nowrap}
.chip.on{background:var(--text);color:var(--bg)}
.info{font-size:13px;color:var(--muted);margin:10px 2px 0;line-height:1.45}
.info b{color:var(--text);font-weight:600}
.info.ziel{color:var(--accent);font-weight:600}
.unitseg{margin:12px 0 0}
.steppers{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:16px 0}
.stepper{background:var(--surface);border-radius:var(--r);padding:12px 10px 10px;text-align:center}
.stepper label{font-size:12px;color:var(--muted);font-weight:600;letter-spacing:.06em;text-transform:uppercase}
.stepper input{width:100%;background:none;border:0;outline:none;text-align:center;font:700 40px/1.15 var(--display);letter-spacing:-.03em;padding:2px 0 8px}
.stepper .btns{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.stepper .btns button{height:44px;border-radius:12px;background:var(--surface2);font-size:22px;font-weight:500;transition:transform .1s}
.stepper .btns button:active{transform:scale(.94);background:var(--line)}
.primary{width:100%;height:56px;border-radius:16px;background:var(--accent);color:var(--accent-ink);font-weight:750;font-size:17px;transition:transform .12s,opacity .2s}
.primary:active{transform:scale(.98)}
.primary:disabled{opacity:.35}
.chips-t{font-size:12px;color:var(--muted);font-weight:600;margin:12px 2px -4px}
.chips-t b{color:var(--text)}
.chips-t:empty{display:none}
.cdot{display:inline-block;width:7px;height:7px;border-radius:50%;margin-right:7px;vertical-align:1px}
.cdot.cali{background:var(--accent)} .cdot.gym{background:var(--sand)}
.timer{margin-top:12px}
.timer-pre{display:flex;align-items:center;justify-content:space-between;gap:10px;font-size:13px;color:var(--muted);font-weight:600}
.pchips{display:flex;gap:6px}
.pchips button{padding:7px 10px;border-radius:10px;background:var(--surface);font-size:13px;font-weight:650;color:var(--muted);font-variant-numeric:tabular-nums}
.pchips button.on{background:var(--surface2);color:var(--text);box-shadow:inset 0 0 0 1.5px var(--line)}
.timer-run{display:none;background:var(--surface);border-radius:var(--r);padding:12px 14px 14px}
.timer.on .timer-pre{display:none}
.timer.on .timer-run{display:block}
.timer-top{display:flex;justify-content:space-between;align-items:center}
.timer-skip{font-size:13px;font-weight:650;color:var(--muted);padding:4px 2px}
.timer-row{display:grid;grid-template-columns:64px 1fr 64px;align-items:center;margin:4px 0 10px}
.timer-row button{height:44px;border-radius:12px;background:var(--surface2);font-weight:700;font-size:15px}
.timer-row button:active{background:var(--line)}
.timer-clock{text-align:center;font:700 46px/1 var(--display);letter-spacing:-.03em}
.timer.soon .timer-clock{color:var(--accent)}
.timer-bar{height:6px;border-radius:3px;background:var(--surface2);overflow:hidden}
.timer-bar i{display:block;height:100%;background:var(--accent);border-radius:3px;transition:width .25s linear}
.fab.timing{background:var(--surface2);color:var(--text);box-shadow:0 0 0 1.5px var(--line),0 8px 24px rgba(0,0,0,.5);padding:0 24px 0 18px;font-size:18px}
.fab.timing svg{width:24px;height:24px}
.fab.done{animation:pulse 1s ease-in-out 3}
@keyframes pulse{50%{box-shadow:0 0 0 10px rgba(255,106,43,.2),0 2px 8px rgba(0,0,0,.5)}}
.menu{display:grid;gap:4px}
.menu button{text-align:left;padding:16px;border-radius:14px;background:var(--surface);font-weight:600;font-size:16px}
.menu button.danger{color:var(--danger)}
.menu small{display:block;color:var(--muted);font-weight:500;font-size:13px;margin-top:2px}
.opt{display:grid;gap:4px;background:var(--surface);border-radius:14px;padding:14px 16px;border:1.5px solid transparent;margin-bottom:8px}
.opt.on{border-color:var(--accent)}
.opt-pick{display:grid;gap:4px;text-align:left}
.opt-top{display:flex;justify-content:space-between;align-items:center;gap:10px}
.opt-name{font-weight:700;font-size:16px}
.lv{display:flex;gap:3px;flex:none;align-items:center}
.lv i{width:7px;height:7px;border-radius:50%;background:var(--line)}
.lv i.on{background:var(--accent)}
.lv span{font-size:11px;color:var(--muted);font-weight:650;margin-right:4px}
.opt-ziel{font-size:13px;color:var(--muted)}

   Vorbild: dunkle Premium-Fitness-App-Konzepte auf YouTube (z. B. „Apex“). ---------- */

<script>
/* ---------- Daten ---------- */
const KEY = 'satzbuch.v1';
let db = load();
function load(){
  try{ const d = JSON.parse(localStorage.getItem(KEY)); if(d && d.ex && Array.isArray(d.sets)) return d; }catch(e){}
  return { ex:{}, sets:[] };
}
function save(){
  try{ localStorage.setItem(KEY, JSON.stringify(db)); }catch(e){ toast('Speichern fehlgeschlagen'); }
}
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2,6);
const e1rm = (w,r) => w <= 0 ? 0 : (r === 1 ? w : w * (1 + r/30));
const dayKey = t => { const d = new Date(t); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); };
const keyToDate = k => { const [y,m,d] = k.split('-').map(Number); return new Date(y,m-1,d); };
const addDays = (d, n) => new Date(d.getFullYear(), d.getMonth(), d.getDate() + n);
const mondayOf = d => addDays(new Date(d.getFullYear(), d.getMonth(), d.getDate()), -((d.getDay() + 6) % 7));
const fmt = (n, dig=1) => n.toLocaleString('de-DE', { maximumFractionDigits: dig });
const fmtDay = (k, opt={ weekday:'short', day:'numeric', month:'short' }) => keyToDate(k).toLocaleDateString('de-DE', opt);
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const parseNum = v => { const n = parseFloat(String(v).replace(',', '.')); return isFinite(n) ? n : 0; };
const today = () => dayKey(Date.now());

/* Plan-Lookups */
const TAGE = ['So','Mo','Di','Mi','Do','Fr','Sa'];
const TAGE_LANG = ['Sonntag','Montag','Dienstag','Mittwoch','Donnerstag','Freitag','Samstag'];
const STUFE = ['', 'Einstieg', 'Mittel', 'Fortgeschritten'];
const GRUPPEN = { push:'Push', pull:'Pull', beine:'Beine', core:'Core', sonst:'Sonstiges' };
function planCfg(){ if(!db.plan) db.plan = { wahl:{}, cTag: GYM_TAGE.C }; return db.plan; }
function gymDay(id){ return id === 'C' ? planCfg().cTag : GYM_TAGE[id]; }
function workoutOn(dow){ return WORKOUTS.find(w => gymDay(w.id) === dow); }
/* Zusatz-Einheit, die heute dazugenommen wurde */
function extraHeute(){ const x = planCfg().extra; return x && x.tag === today() ? (window.EXTRAS || []).find(w => w.id === x.id) || null : null; }
/* Wahl wird als Übungsname gespeichert; fehlt sie, gilt die Vorauswahl des Slots */
function chosen(slot){
  if(slot.wie) return chosen(slotById(slot.wie));
  /* Aufstieg aus einem früheren Training: ab heute gilt die nächste Stufe */
  const a = planCfg().auf?.[slot.id];
  if(a && a.tag !== today()){
    if((planCfg().wahl[slot.id] || slot.std) === a.von) planCfg().wahl[slot.id] = a.nach;
    delete planCfg().auf[slot.id]; save();
  }
  const w = planCfg().wahl[slot.id];
  return slot.optionen.find(o => o.name === w) || slot.optionen.find(o => o.name === slot.std) || slot.optionen[0];
}
const ALLE_WK = () => [...WORKOUTS, ...(window.EXTRAS || [])];
/* Gespiegelte Plätze (wie: 'A1') zählen nicht extra, sie folgen dem Platz im Wochenplan */
const allSlots = () => ALLE_WK().flatMap(w => w.slots).filter(s => !s.wie);
const slotById = id => ALLE_WK().flatMap(w => w.slots).find(s => s.id === id);
const mainSlot = slot => slot?.wie ? slotById(slot.wie) : slot;
function stilPick(slot, stil){
  if(stil === 'mix') return slot.std;
  return (slot.optionen.find(o => o.art === stil) || slot.optionen.find(o => o.name === slot.std)).name;
}
function currentStil(){ return ['mix','cali','gym'].find(st => allSlots().every(s => chosen(s).name === stilPick(s, st))) || ''; }
function optionFor(name){
  const n = String(name).trim().toLowerCase(); if(!n) return null;
  for(const w of ALLE_WK()) for(const slot of w.slots) for(const opt of slot.optionen)
    if(opt.name.toLowerCase() === n) return { w, slot, opt };
  return null;
}
function zielText(o){ return `${o.s} × ${o.von}–${o.bis} ${o.einheit === 'sec' ? 's' : 'Wdh.'}${o.seite ? ' pro Seite' : ''}`; }
function guessGroup(name){
  const n = name.toLowerCase();
  if(/bank|dip|drück|liegest|push|planche|schulter|front ?heb|trizeps/.test(n)) return 'push';
  if(/klimm|rud|latz|zug|pull|lever|bizeps|curl(?!s)/.test(n)) return 'pull';
  if(/knie|bein|wade|kreuz|ausfall|hip|squat|lunge|nordic|step/.test(n)) return 'beine';
  if(/bauch|core|hollow|plank|sit|wheel|flag/.test(n)) return 'core';
  return 'sonst';
}
function groupOf(id){ const ex = db.ex[id]; if(!ex) return 'sonst'; return ex.gruppe || optionFor(ex.name)?.slot.gruppe || guessGroup(ex.name); }

/* Übungen und Sätze */
function setsOf(id){ return db.sets.filter(s => s.ex === id).sort((a,b) => a.t - b.t); }
function findEx(name){ const n = name.trim().toLowerCase(); return n ? Object.keys(db.ex).find(id => db.ex[id].name.toLowerCase() === n) : undefined; }
/* kg = Gewichtsübung (1RM), reps = nur Wiederholungen, sec = Halteübung */
function modeOf(id){
  const ex = db.ex[id]; if(ex?.unit === 'sec') return 'sec';
  const s = setsOf(id); return s.length && s.every(x => x.w === 0) ? 'reps' : 'kg';
}
const score = (x, mode) => mode === 'kg' ? e1rm(x.w, x.r) : x.r;
function fmtSet(x, mode){
  if(mode === 'sec') return (x.w > 0 ? `+${fmt(x.w)} <span class="x">kg ·</span> ` : '') + `${x.r} <span class="x">s</span>`;
  if(mode === 'reps') return `${x.r} <span class="x">Wdh.</span>`;
  return `${fmt(x.w)} <span class="x">kg ×</span> ${x.r}`;
}
const fmtSetPlain = (x, mode) => fmtSet(x, mode).replace(/<[^>]+>/g, '');
function sessions(id){
  const mode = modeOf(id), map = new Map();
  for(const s of setsOf(id)){ const k = dayKey(s.t); if(!map.has(k)) map.set(k, []); map.get(k).push(s); }
  return [...map].map(([day, sets]) => ({
    day, sets,
    best: Math.max(...sets.map(s => score(s, mode))),
    top: Math.max(...sets.map(s => s.w)),
    e1: Math.max(...sets.map(s => e1rm(s.w, s.r))),
    vol: sets.reduce((a,s) => a + s.w * s.r, 0),
    reps: Math.max(...sets.map(s => s.r)),
  }));
}
/* Rekord = ein Satz schlägt den bisherigen Bestwert der Übung */
function prIds(id){
  const ids = new Set(), mode = modeOf(id); let best = null;
  for(const s of setsOf(id)){
    const v = score(s, mode);
    if(best !== null && v > best + 1e-9) ids.add(s.id);
    if(best === null || v > best) best = v;
  }
  return ids;
}
function lastUsed(id){ const s = setsOf(id); return s.length ? s[s.length-1].t : (db.ex[id]?.created || 0); }
function exercisesSorted(){ return Object.keys(db.ex).sort((a,b) => lastUsed(b) - lastUsed(a)); }
function setsToday(name){ const id = findEx(name); return id ? setsOf(id).filter(s => dayKey(s.t) === today()) : []; }
/* ---------- Progression ----------
   Ziel erreicht = mindestens s Sätze am oberen Ende (bis), mit dem schwersten Gewicht dieses Trainings.
   Gibt es im Slot eine nächste Stufe (slot.auf), wechselt der Plan beim nächsten Training dorthin.
   Sonst Doppelte Progression: beim nächsten Mal + o.plus kg und wieder unten im Wiederholungsbereich anfangen. */
const zielKurz = o => `${o.s} × ${o.bis}${o.einheit === 'sec' ? ' s' : ''}`;
function amZiel(o, sets){
  if(!sets.length) return 0;
  const top = Math.max(...sets.map(x => x.w));
  return sets.filter(x => x.w >= top - 1e-9 && x.r >= o.bis).length;
}
const zielErreicht = (o, sets) => amZiel(o, sets) >= o.s;
function nextOf(slot, name){ const n = slot.auf?.[name]; return n ? slot.optionen.find(o => o.name === n) : null; }
/* Platz, in dem diese Übung gerade dran ist (heutiges Training bevorzugt) */
function slotFor(name){
  const n = String(name).trim().toLowerCase(); if(!n) return null;
  const tw = workoutOn(new Date().getDay()), xw = extraHeute();
  const hits = allSlots().filter(s => chosen(s).name.toLowerCase() === n);
  const inW = w => w && hits.find(s => w.slots.some(x => mainSlot(x) === s));
  return inW(tw) || inW(xw) || hits[0] || mainSlot(optionFor(name)?.slot) || null;
}
/* Ganze Leiter, in der die Übung steht: Vorgänger (bevorzugt die schon trainierten) und Nachfolger */
function leiterOf(slot, name){
  const auf = slot.auf || {}, chain = [name];
  for(let cur = name, i = 0; i < 8; i++){
    const prev = Object.keys(auf).filter(k => auf[k] === cur && !chain.includes(k));
    if(!prev.length) break;
    cur = prev.find(k => findEx(k)) || prev.find(k => k === slot.std) || prev[0]; chain.unshift(cur);
  }
  for(let cur = name, i = 0; i < 8 && auf[cur] && !chain.includes(auf[cur]); i++){ cur = auf[cur]; chain.push(cur); }
  return chain;
}
/* Gewichtssprung fürs nächste Training, falls das letzte Training (nicht heute) das Ziel geschafft hat */
function steigerung(slot, o){
  if(!o.plus || (slot && nextOf(slot, o.name))) return null;
  const id = findEx(o.name); if(!id) return null;
  const ses = sessions(id), last = ses[ses.length-1];
  if(!last || last.day === today() || !zielErreicht(o, last.sets)) return null;
  return { w: last.top + o.plus, plus: o.plus };
}
function readyFor(o, slot){
  slot = slot || slotFor(o.name);
  const a = slot && planCfg().auf?.[slot.id];
  if(a && a.von === o.name) return `Nächstes Mal: ${a.nach}`;
  const st = slot ? steigerung(slot, o) : null;
  if(st) return `Heute +${fmt(st.plus)} kg → ${fmt(st.w)} kg`;
  return '';
}
/* Nach dem Speichern: Ziel geschafft → Aufstieg vormerken (gilt ab dem nächsten Training) */
function pruefeAufstieg(name, id){
  const heute = setsOf(id).filter(s => dayKey(s.t) === today()), neu = [];
  for(const slot of allSlots()){
    const o = chosen(slot); if(o.name !== name) continue;
    const nx = nextOf(slot, o.name), p = planCfg();
    if(!nx || p.auf?.[slot.id] || !zielErreicht(o, heute)) continue;
    (p.auf ||= {})[slot.id] = { von: o.name, nach: nx.name, tag: today() };
    (p.verlauf ||= []).push({ slot: slot.id, von: o.name, nach: nx.name, t: Date.now() });
    neu.push({ slot, nx });
  }
  if(neu.length) save();
  return neu;
}
function aufstiegZurueck(slotId){
  const p = planCfg(), a = p.auf?.[slotId]; if(!a) return;
  delete p.auf[slotId];
  const i = (p.verlauf || []).findLastIndex(v => v.slot === slotId && v.nach === a.nach);
  if(i >= 0) p.verlauf.splice(i, 1);
  save();
}
/* Satz gelöscht: Aufstieg von heute zurücknehmen, wenn das Ziel nicht mehr erfüllt ist */
function aufstiegeNachpruefen(){
  for(const [sid, a] of Object.entries(planCfg().auf || {})){
    if(a.tag !== today()) continue;
    const slot = allSlots().find(s => s.id === sid), o = slot?.optionen.find(x => x.name === a.von), id = findEx(a.von);
    const heute = id ? setsOf(id).filter(s => dayKey(s.t) === today()) : [];
    if(!o || !zielErreicht(o, heute)) aufstiegZurueck(sid);
  }
}
/* Fortschrittskasten: Leiter, Aufstiegsziel und wie viele Sätze heute schon am Ziel sind */
function progHtml(slot, o, withToday = true){
  if(!slot || !o) return '';
  const nx = nextOf(slot, o.name), a = planCfg().auf?.[slot.id], won = a && a.von === o.name;
  const chain = leiterOf(slot, o.name), at = chain.indexOf(o.name);
  if(!nx && !o.plus && chain.length < 2) return '';
  const id = findEx(o.name), heute = id && withToday ? setsOf(id).filter(s => dayKey(s.t) === today()) : [];
  const n = Math.min(o.s, amZiel(o, heute));
  const rungs = chain.length > 1 ? `<div class="rungs">${chain.map((c, i) =>
    `${i ? '<span class="ar">›</span>' : ''}<span class="rung ${i < at || (won && i === at) ? 'done' : i === at ? 'cur' : i === at + 1 ? 'nx' : ''}">${esc(c)}</span>`).join('')}</div>` : '';
  let text;
  if(won) text = `Stufe geschafft. <b>Ab dem nächsten Training: ${esc(a.nach)}</b>. Die alte Stufe passt gut zum Aufwärmen.`;
  else if(nx) text = `Aufstieg bei <b>${zielKurz(o)}${o.seite ? ' pro Seite' : ''}</b> in allen Sätzen → danach <b>${esc(nx.name)}</b>`;
  else if(o.plus){
    const st = steigerung(slot, o);
    text = st ? `Letztes Mal alle Sätze geschafft: <b>heute +${fmt(st.plus)} kg</b>, wieder bei ${o.von} ${o.einheit === 'sec' ? 's' : 'Wdh.'} anfangen.`
              : `Schaffst du <b>${zielKurz(o)}</b> in allen Sätzen, kommen beim nächsten Mal <b>+${fmt(o.plus)} kg</b> drauf.`;
  } else text = `Endstufe der Leiter. Steigern: langsamer absenken, länger halten oder ${o.bw ? 'Zusatzgewicht' : 'mehr Gewicht'}.`;
  const showBar = withToday && !won && (nx || o.plus);
  return `<div class="prog ${won ? 'win' : ''}">
    <div class="prog-top"><span>${nx || won ? `Progression · Stufe ${at + 1}/${chain.length}` : 'Progression'}</span>${showBar ? `<span class="num">${n}/${o.s} am Ziel</span>` : ''}</div>
    ${rungs}${showBar ? `<div class="prog-bar"><i style="width:${n / o.s * 100}%"></i></div>` : ''}<p>${text}</p></div>`;
}
function relDay(k){
  const diff = Math.round((keyToDate(today()) - keyToDate(k)) / 864e5);
  if(diff === 0) return 'heute'; if(diff === 1) return 'gestern'; if(diff < 7) return `vor ${diff} Tagen`;
  return fmtDay(k, { day:'numeric', month:'short' });
}

function rowHtml(id){
  const ex = db.ex[id], ses = sessions(id), mode = modeOf(id);
  let meta = 'Noch keine Sätze', spark = '', delta = '';
  if(ses.length){
    const last = ses[ses.length-1];
    const best = last.sets.reduce((a,s) => score(s, mode) > score(a, mode) ? s : a);
    meta = `<b class="num">${fmtSetPlain(best, mode)}</b> · ${relDay(last.day)}`;
    spark = sparkSvg(ses.slice(-12).map(s => s.best));
    if(ses.length > 1){
      const first = ses[0].best, p = first > 0 ? Math.round((last.best - first) / first * 100) : 0;
      delta = `<span class="delta num ${p>0?'up':p<0?'down':'flat'}">${p>0?'+':''}${p} %</span>`;
    }
  }
  return `<li><button class="row" data-ex="${id}">
    <div style="min-width:0"><div class="name">${esc(ex.name)}</div><div class="meta">${meta}</div></div>
    <div class="right">${spark}${delta}</div></button></li>`;
}
function sparkSvg(vals){
  if(vals.length < 2) return '<svg class="spark"></svg>';
  const W=64, H=28, p=3, mn=Math.min(...vals), mx=Math.max(...vals), rg = mx - mn || 1;
  const pts = vals.map((v,i) => [p + i*(W-2*p)/(vals.length-1), H - p - (v-mn)/rg*(H-2*p)]);
  const d = pts.map((q,i) => (i?'L':'M') + q[0].toFixed(1) + ' ' + q[1].toFixed(1)).join(' ');
  const l = pts[pts.length-1];
  return `<svg class="spark" viewBox="0 0 ${W} ${H}"><path d="${d}" fill="none" stroke="var(--accent)" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" opacity=".9"/><circle cx="${l[0]}" cy="${l[1]}" r="2.6" fill="var(--accent)"/></svg>`;
}

/* ---------- Statistik ---------- */
function renderStats(){
  if(!db.sets.length){ app.innerHTML = header('Dein Fortschritt', 'Statistik') + emptyHtml(); bindEmpty(); return; }
  const now = new Date(), mon = mondayOf(now), ZIEL = 3;
  const daySets = new Map(); for(const s of db.sets){ const k = dayKey(s.t); daySets.set(k, (daySets.get(k) || 0) + 1); }
  const weekDays = k => { let n = 0; for(let i = 0; i < 7; i++) if(daySets.has(dayKey(addDays(keyToDate(k), i)))) n++; return n; };
  const thisWeek = weekDays(dayKey(mon));
  let streak = thisWeek >= ZIEL ? 1 : 0;
  for(let d = addDays(mon, -7); weekDays(dayKey(d)) >= ZIEL; d = addDays(d, -7)) streak++;

  let vol = 0, prCount = 0; const prList = [];
  for(const s of db.sets) vol += s.w * s.r;
  for(const id of Object.keys(db.ex)){ const p = prIds(id), mode = modeOf(id); prCount += p.size;
    for(const s of db.sets) if(p.has(s.id)) prList.push({ s, id, mode }); }
  prList.sort((a,b) => b.s.t - a.s.t);

  /* Sätze pro Woche, 12 Wochen */
  const WEEKS = 12;
  const weeks = Array.from({ length: WEEKS }, (_, i) => { const start = addDays(mon, -7 * (WEEKS - 1 - i)); return { start, end: addDays(start, 7), sets: 0, vol: 0 }; });
  for(const s of db.sets){ const w = weeks.find(w => s.t >= w.start && s.t < w.end); if(w){ w.sets++; w.vol += s.w * s.r; } }
  const W = 320, H = 130, B = 20, T = 18, mx = Math.max(...weeks.map(w => w.sets), 1), bw = (W - 4) / WEEKS;
  const mxIdx = weeks.findIndex(w => w.sets === mx);
  const bars = weeks.map((w, i) => { const h = w.sets / mx * (H - B - T), x = 2 + i * bw, cur = i === WEEKS - 1;
    return `<rect x="${(x + 3).toFixed(1)}" y="${(H - B - h).toFixed(1)}" width="${(bw - 6).toFixed(1)}" height="${Math.max(h, 2).toFixed(1)}" rx="4" fill="${cur ? 'var(--accent)' : '#34343a'}"/>
      ${(cur || i === mxIdx) && w.sets ? `<text x="${(x + bw/2).toFixed(1)}" y="${(H - B - h - 6).toFixed(1)}" text-anchor="middle" fill="${cur ? 'var(--accent)' : 'var(--muted)'}" font-size="10.5" font-weight="700">${w.sets}</text>` : ''}`; }).join('');
  const wl = i => `<text x="${(2 + i * bw + bw/2).toFixed(1)}" y="${H - 4}" text-anchor="middle" fill="var(--faint)" font-size="10" font-weight="600">${weeks[i].start.toLocaleDateString('de-DE', { day:'numeric', month:'numeric' })}</text>`;

  /* Kalender: 12 Wochen × 7 Tage */
  const heat = weeks.map(w => Array.from({ length: 7 }, (_, j) => { const d = addDays(w.start, j), k = dayKey(d), n = daySets.get(k) || 0;
    const cls = d > now ? 'fut' : n >= 16 ? 'l3' : n >= 8 ? 'l2' : n > 0 ? 'l1' : '';
    return `<i class="${cls} ${k === today() ? 'now' : ''}" title="${k}: ${n} Sätze"></i>`; }).join('')).join('');

  /* Muskelgruppen diese Woche vs. letzte */
  const grp = (from, to) => { const r = {}; for(const s of db.sets) if(s.t >= from && s.t < to){ const g = groupOf(s.ex); r[g] = (r[g] || 0) + 1; } return r; };
  const gNow = grp(+mon, +addDays(mon, 7)), gLast = grp(+addDays(mon, -7), +mon);
  const keys = Object.keys(GRUPPEN).filter(g => g !== 'sonst' || gNow.sonst || gLast.sonst);
  const gmx = Math.max(1, ...keys.map(g => Math.max(gNow[g] || 0, gLast[g] || 0)));

  const totalDays = daySets.size;
  app.innerHTML = `
    ${header('Dein Fortschritt', 'Statistik')}
    <section class="card streak">
      <div><p class="eyebrow">Wochen-Serie</p>
        <div class="big num">${streak}<small>${streak === 1 ? 'Woche' : 'Wochen'}</small></div>
        <p class="sub">in Folge mit ${ZIEL} Gym-Tagen${thisWeek < ZIEL ? ` · noch ${ZIEL - thisWeek} diese Woche` : ''}</p></div>
      <div class="ring">${ringSvg(thisWeek / ZIEL)}<div><b class="num">${thisWeek}/${ZIEL}</b><span>diese Woche</span></div></div>
    </section>
    <div class="tiles">
      <div class="tile"><p class="eyebrow">Trainingstage</p><b class="num">${totalDays}</b></div>
      <div class="tile"><p class="eyebrow">Sätze</p><b class="num">${db.sets.length}</b></div>
      <div class="tile"><p class="eyebrow">Bewegt</p><b class="num">${fmt(vol / 1000, 1)}<small>t</small></b></div>
      <div class="tile"><p class="eyebrow">Rekorde</p><b class="num up">${prCount}</b></div>
    </div>
    ${trainingsHtml()}
    <h2 class="section"><span>Sätze pro Woche</span><span class="num">Ø ${fmt(weeks.reduce((a,w) => a + w.sets, 0) / WEEKS, 0)}</span></h2>
    <section class="card chartcard"><svg viewBox="0 0 ${W} ${H}">${bars}${wl(0)}${wl(5)}${wl(WEEKS - 1)}</svg></section>
    <h2 class="section"><span>Trainingstage</span><span>12 Wochen</span></h2>
    <section class="card heat"><div class="heat-l">${['Mo','','Mi','','Fr','','So'].map(l => `<span>${l}</span>`).join('')}</div><div class="heat-g">${heat}</div></section>
    <h2 class="section"><span>Muskelgruppen</span><span>Woche · <span style="color:var(--faint)">Vorwoche</span></span></h2>
    <section class="card split">${keys.map(g => `<div class="split-row"><span>${GRUPPEN[g]}</span>
      <span class="bar"><i style="width:${((gNow[g] || 0) / gmx * 100).toFixed(0)}%"></i></span>
      <span class="v num">${gNow[g] || 0} <small>· ${gLast[g] || 0}</small></span></div>`).join('')}
      ${!(gNow.beine) ? `<p class="info" style="margin:0">Diese Woche noch keine Beine. Tag C ist ${TAGE_LANG[gymDay('C')]}${gymDay('C') === 6 ? 'nachmittag' : ''}.</p>` : ''}</section>
    ${prList.length ? `<h2 class="section"><span>Letzte Rekorde</span></h2>
    <section class="card prs" style="padding:4px 0">${prList.slice(0, 5).map(p => `<button class="pr-row" data-ex="${p.id}">
      <div><p class="n">${esc(db.ex[p.id].name)}</p><p class="d">${relDay(dayKey(p.s.t))}</p></div><span class="num">${fmtSet(p.s, p.mode)}</span></button>`).join('')}</section>` : ''}`;
  app.querySelectorAll('[data-ex]').forEach(b => b.onclick = () => go({ name:'ex', id:b.dataset.ex }));
}
function trainingsHtml(){

}
function ringSvg(f){

}

}
const setRow = (x, i, mode, prs) => `<div class="set num"><span class="n">${i+1}</span><span>${fmtSet(x, mode)}</span>
  <span>${prs.has(x.id) ? '<span class="pr">PR</span>' : ''}</span>
  <button class="del" data-del="${x.id}" aria-label="Satz löschen">${I.x}</button></div>`;

function drawChart(ses, m, unit){
  const vals = ses.map(s => m === 'reps' ? s.reps : m === 'top' ? s.top : m === 'vol' ? s.vol : s.e1);
  const W=320, H=170, L=8, R=40, T=14, B=24;
  let mn = Math.min(...vals), mx = Math.max(...vals);
  const pad = (mx - mn) * .15 || Math.max(mx * .1, 1); mn = Math.max(0, mn - pad); mx = mx + pad;
  const x = i => L + i * (W-L-R) / (ses.length-1);
  const y = v => T + (1 - (v-mn)/(mx-mn)) * (H-T-B);
  const pts = vals.map((v,i) => [x(i), y(v)]);
  const line = pts.map((p,i) => (i?'L':'M') + p[0].toFixed(1) + ' ' + p[1].toFixed(1)).join(' ');
  const area = line + ` L ${pts[pts.length-1][0].toFixed(1)} ${H-B} L ${pts[0][0].toFixed(1)} ${H-B} Z`;
  const grid = [0,.5,1].map(f => { const v = mn + (mx-mn)*f, yy = y(v);
    return `<line x1="${L}" x2="${W-R+6}" y1="${yy}" y2="${yy}" stroke="var(--line)" stroke-dasharray="2 4"/>
      <text x="${W-R+10}" y="${yy+4}" fill="var(--faint)" font-size="10" font-weight="600">${fmt(v, m==='reps' || v>=100 ? 0 : 1)}</text>`; }).join('');
  const lab = (i, anchor) => `<text x="${x(i)}" y="${H-6}" fill="var(--faint)" font-size="10" font-weight="600" text-anchor="${anchor}">${fmtDay(ses[i].day,{day:'numeric',month:'short'})}</text>`;
  const el = document.getElementById('chart');
  el.innerHTML = `<svg viewBox="0 0 ${W} ${H}">
    <defs><linearGradient id="g" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="var(--accent)" stop-opacity=".22"/><stop offset="1" stop-color="var(--accent)" stop-opacity="0"/></linearGradient></defs>
    ${grid}<path d="${area}" fill="url(#g)"/>
    <path d="${line}" fill="none" stroke="var(--accent)" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round"/>
    ${pts.map(p => `<circle cx="${p[0]}" cy="${p[1]}" r="2.4" fill="var(--bg)" stroke="var(--accent)" stroke-width="1.6"/>`).join('')}
    <line id="cur" y1="${T}" y2="${H-B}" stroke="var(--muted)" stroke-width="1" opacity="0"/>
    <circle id="dot" r="5" fill="var(--accent)" stroke="var(--bg)" stroke-width="2"/>
    ${lab(0,'start')}${lab(ses.length-1,'end')}
    <rect x="0" y="0" width="${W}" height="${H}" fill="transparent"/></svg>`;
  const svg = el.querySelector('svg'), dot = svg.querySelector('#dot'), cur = svg.querySelector('#cur'), ro = document.getElementById('readout');
  const show = (i, active) => {
    dot.setAttribute('cx', pts[i][0]); dot.setAttribute('cy', pts[i][1]);
    cur.setAttribute('x1', pts[i][0]); cur.setAttribute('x2', pts[i][0]); cur.setAttribute('opacity', active ? .5 : 0);
    ro.innerHTML = `<span>${fmtDay(ses[i].day)}</span><b class="num">${fmt(vals[i], m==='vol'?0:1)} ${unit}</b>`;
  };
  show(pts.length-1, false);
  const pick = e => { const r = svg.getBoundingClientRect(); const px = (e.clientX - r.left) / r.width * W;
    let bi = 0; pts.forEach((p,i) => { if(Math.abs(p[0]-px) < Math.abs(pts[bi][0]-px)) bi = i; }); show(bi, true); };
  svg.addEventListener('pointermove', pick); svg.addEventListener('pointerdown', pick);
  svg.addEventListener('pointerleave', () => show(pts.length-1, false));
}

/* Vorschlag: letzter Satz der Übung, sonst das Planziel */
function applyDefaults(){

  log.pause = po ? pauseSec(po.slot.pause) : (db.ex[id]?.pause || 90);
  if(po){ log.unit = po.opt.einheit; log.w = po.opt.bw ? 0 : log.w; log.r = po.opt.von; }
  if(id){

    const s = setsOf(id); if(s.length){ const l = s[s.length-1]; log.w = l.w; log.r = l.r; }

  const slot = po && slotFor(log.name), o = slot?.optionen.find(x => x.name.toLowerCase() === log.name.trim().toLowerCase());
  const st = o && steigerung(slot, o);
  if(st){ log.w = st.w; log.r = o.von; }
}

function saveSet(){
  const name = log.name.trim(); if(!name) return;
  log.w = parseNum(document.getElementById('w').value);
  log.r = Math.round(parseNum(document.getElementById('r').value));
  if(log.r < 1){ toast(log.unit === 'sec' ? 'Mindestens 1 Sekunde' : 'Mindestens 1 Wiederholung'); return; }
  const po = optionFor(name);
  let id = findEx(name);
  if(!id){ id = uid(); db.ex[id] = { name, created: Date.now() }; }
  const ex = db.ex[id];
  if(!ex.unit && log.unit === 'sec' && !setsOf(id).length) ex.unit = 'sec';
  if(!ex.gruppe && po) ex.gruppe = po.slot.gruppe;
  /* Erster Satz ohne laufendes Training: Stoppuhr startet von selbst */
  let gestartet = false;
  if(!db.training){ trainingStarten(heutigeEinheit(name)?.id, true); gestartet = true; }
  zumTraining([name]);
  const set = { id: uid(), ex: id, w: log.w, r: log.r, t: Date.now() };
  db.sets.push(set); save(); uhrZeigen();
  navigator.vibrate?.(12);
  const n = setsOf(id).filter(s => dayKey(s.t) === today()).length;
  const auf = pruefeAufstieg(name, id);
  if(auf.length){
    navigator.vibrate?.([20, 60, 20]);
    toast("Stufe geschafft 🎉", true, () => { auf.forEach(a => aufstiegZurueck(a.slot.id)); render(); if(sheetOpen && log) syncLog(); });
    confetti();
  }
  else if(prIds(id).has(set.id)){ toast('Neuer Rekord 🎉', true); confetti(); }
  else if(po && n === po.opt.s) toast('Übung geschafft ✓');
  else if(gestartet) toast('Gespeichert · Trainingsuhr läuft');
  else toast('Gespeichert');
  if(!po) ex.pause = log.pause;
  save();
  startRest(log.pause, name);
  syncLog(); render();
}

/* ---------- Pausen-Timer (Countdown, läuft auch bei geschlossenem Fenster weiter) ---------- */
const REST_KEY = 'satzbuch.pause';
let rest = null, restTick = null, restDone = null, audio = null, fabState = '';
try{ rest = JSON.parse(localStorage.getItem(REST_KEY)); }catch(e){}
function pauseSec(p){ const m = String(p || '').match(/\d+/), n = m ? +m[0] : 90; return /min/.test(p) ? n * 60 : n; }
function fmtClock(s){ return `${Math.floor(s / 60)}:${String(s % 60).padStart(2, '0')}`; }
function saveRest(){ try{ rest ? localStorage.setItem(REST_KEY, JSON.stringify(rest)) : localStorage.removeItem(REST_KEY); }catch(e){} }
function restLeft(){ return rest ? Math.max(0, Math.ceil((rest.end - Date.now()) / 1000)) : 0; }
function startRest(sec, ex){
  unlockAudio();
  rest = { end: Date.now() + sec * 1000, total: sec, ex }; restDone = null; saveRest();
  clearInterval(restTick); restTick = setInterval(updateTimerUI, 250); updateTimerUI();
}
function shiftRest(d){
  if(!rest) return;
  rest.end = Math.max(Date.now() + 1000, rest.end + d * 1000); rest.total = Math.max(restLeft(), rest.total + d);
  saveRest(); updateTimerUI(); navigator.vibrate?.(5);
}
function stopRest(){ rest = null; saveRest(); clearInterval(restTick); restTick = null; updateTimerUI(); }
function finishRest(){
  restDone = { ex: rest.ex, at: Date.now() };
  rest = null; saveRest(); clearInterval(restTick); restTick = null;
  beep(); navigator.vibrate?.([250, 120, 250, 120, 400]);
  toast('Pause vorbei · nächster Satz', true);
  updateTimerUI(); setTimeout(updateTimerUI, 8100);
}
function updateTimerUI(){
  if(rest && Date.now() >= rest.end) return finishRest();
  const left = restLeft();
  const t = document.getElementById('timer');
  if(t){
    t.classList.toggle('on', !!rest);
    if(rest){
      t.querySelector('.timer-clock').textContent = fmtClock(left);
      t.querySelector('.timer-bar i').style.width = (left / rest.total * 100).toFixed(1) + '%';
      t.classList.toggle('soon', left <= 10);
    }
  }
  /* Hauptknopf zeigt den Timer, solange das Fenster zu ist */
  const fab = document.getElementById('fab');
  const done = restDone && Date.now() - restDone.at < 8000;
  const state = rest && !sheetOpen ? 'run' : done && !sheetOpen ? 'done' : 'idle';
  if(state === 'run') fab.innerHTML = `${miniRing(left / rest.total)}<span class="num">${fmtClock(left)}</span>`;
  else if(state !== fabState) fab.innerHTML = state === 'done' ? `${I.next}<span>Nächster Satz</span>` : `${I.plus}Satz`;
  fab.classList.toggle('timing', state === 'run'); fab.classList.toggle('done', state === 'done');
  fabState = state;
}
function miniRing(f){
  const c = 2 * Math.PI * 9;
  return `<svg viewBox="0 0 24 24" style="transform:rotate(-90deg)"><circle cx="12" cy="12" r="9" fill="none" stroke="var(--line)" stroke-width="3"/><circle cx="12" cy="12" r="9" fill="none" stroke="var(--accent)" stroke-width="3" stroke-linecap="round" stroke-dasharray="${(c * Math.max(0, f)).toFixed(1)} ${c.toFixed(1)}"/></svg>`;
}
function unlockAudio(){
  try{ audio = audio || new (window.AudioContext || window.webkitAudioContext)(); if(audio.state === 'suspended') audio.resume(); }catch(e){}
}
function beep(){
  if(!audio) return;
  try{
    const t0 = audio.currentTime;
    [0, .28, .56].forEach((d, i) => {
      const o = audio.createOscillator(), g = audio.createGain();
      o.type = 'sine'; o.frequency.value = i === 2 ? 1175 : 880;
      g.gain.setValueAtTime(0.0001, t0 + d);
      g.gain.exponentialRampToValueAtTime(0.3, t0 + d + 0.02);
      g.gain.exponentialRampToValueAtTime(0.0001, t0 + d + (i === 2 ? 0.45 : 0.2));
      o.connect(g).connect(audio.destination); o.start(t0 + d); o.stop(t0 + d + 0.5);
    });
  }catch(e){}
}
document.addEventListener('visibilitychange', () => { if(!document.hidden) updateTimerUI(); });
function deleteSet(sid){
  const i = db.sets.findIndex(s => s.id === sid); if(i < 0) return;
  const [removed] = db.sets.splice(i, 1); aufstiegeNachpruefen(); save(); render(); uhrZeigen();
  if(sheetOpen && log) syncLog();
  toast('Satz gelöscht', false, () => { db.sets.push(removed); save(); render(); uhrZeigen(); if(sheetOpen && log) syncLog(); });
}

/* ---------- Training: Stoppuhr für die ganze Einheit ----------
   db.training = laufendes Training { start, wk, name, ex:[Übungsnamen] }
   db.trainings = abgeschlossene Trainings { id, start, end, wk, name, saetze, uebungen, vol, prs }
   Zum Training zählen alle Sätze ab dem Start. Der erste gespeicherte Satz startet es von selbst. */
const pad2 = n => String(n).padStart(2, '0');
function fmtDauer(s){ const h = Math.floor(s / 3600), m = Math.floor(s % 3600 / 60), x = s % 60; return h ? `${h}:${pad2(m)}:${pad2(x)}` : `${m}:${pad2(x)}`; }
function fmtDauerKurz(s){ const m = Math.round(s / 60); return m < 60 ? `${m} min` : `${Math.floor(m / 60)} h ${pad2(m % 60)}`; }
const fmtUhrzeit = t => new Date(t).toLocaleTimeString('de-DE', { hour:'2-digit', minute:'2-digit' });
const wkById = id => ALLE_WK().find(w => w.id === id);
const planNamen = w => [...new Set(w.slots.map(s => chosen(mainSlot(s)).name))];
const trainingSaetze = (tr, end = Date.now()) => db.sets.filter(s => s.t >= tr.start && s.t <= end);
const trainingSek = tr => Math.max(0, Math.floor(((tr.end || Date.now()) - tr.start) / 1000));
const imTraining = name => db.training?.ex.some(n => n.toLowerCase() === String(name).trim().toLowerCase());
function saetzeImTraining(name){
  const id = findEx(name), tr = db.training;
  return id && tr ? db.sets.filter(s => s.ex === id && s.t >= tr.start) : [];
}
/* Einheit, zu der eine Übung heute gehört (Gym-Tag zuerst, dann Extra) */
function heutigeEinheit(name){
  const n = String(name || '').trim().toLowerCase();
  const kand = [workoutOn(new Date().getDay()), extraHeute()].filter(Boolean);
  return kand.find(w => !n || planNamen(w).some(x => x.toLowerCase() === n)) || null;
}
let uhrTick = null;
function trainingStarten(wkId, still){
  if(db.training) return;
  const w = wkId ? wkById(wkId) : null;

function trainingBeenden(auto){
  const tr = db.training; if(!tr) return;
  const jetzt = Date.now(), sets = trainingSaetze(tr, jetzt);
  if(!sets.length){
    if(!auto && !confirm('Noch kein Satz eingetragen. Training ohne Speichern beenden?')) return;
    db.training = null; save(); uhrLaeuft(); if(!auto){ closeSheet(); render(); toast('Training beendet, nichts gespeichert'); }
    return;
  }
  const letzter = Math.max(...sets.map(s => s.t)), spaet = jetzt - letzter > 20 * 60e3;
  const end = spaet ? letzter + 3 * 60e3 : jetzt;
  const ids = [...new Set(sets.map(s => s.ex))];
  let prs = 0; for(const id of ids){ const p = prIds(id); prs += sets.filter(s => p.has(s.id)).length; }
  const rec = { id: uid(), start: tr.start, end, wk: tr.wk, name: tr.name, saetze: sets.length, uebungen: ids.length, vol: Math.round(sets.reduce((a, s) => a + s.w * s.r, 0)), prs };

  db.training = null; save(); uhrLaeuft(); render();
  if(auto) return rec;
  zeigeAbschluss(rec, sets, spaet);
  if(prs) confetti();
}

/* ---------- Beispieldaten: 8 Wochen nach Plan ---------- */
function loadDemo(){
  const base = { 'Kabel-Frontheben':5, 'Kabelrudern':40, 'Straight-Arm-Latzug':20, 'Kniebeuge':60, 'Rumänisches Kreuzheben':55, 'Bulgarische Split-Kniebeuge':12, 'Wadenheben stehend':40 };
  const mon = mondayOf(new Date()), now = Date.now();
  for(const w of WORKOUTS) for(const slot of w.slots){
    const o = chosen(slot);
    let id = findEx(o.name); if(!id){ id = uid(); db.ex[id] = { name:o.name, created: now, gruppe: slot.gruppe, ...(o.einheit === 'sec' ? { unit:'sec' } : {}) }; }
    for(let k = 0; k < 8; k++){
      const day = addDays(mon, -7 * (7 - k) + ((gymDay(w.id) + 6) % 7));
      const t0 = day.getTime() + 17 * 36e5 + w.slots.indexOf(slot) * 9e5;
      if(t0 > now) continue;
      const wt = o.bw ? 0 : (base[o.name] ?? 20) + 2.5 * Math.floor(k / 2);
      for(let s = 0; s < o.s; s++){
        const r = Math.max(1, Math.min(o.bis + 2, o.von + Math.floor(k * (o.bis - o.von) / 7) - (s >= o.s - 1 ? 1 : 0) + (k % 3 === 2 ? -1 : 0)));
        db.sets.push({ id: uid(), ex: id, w: wt, r, t: t0 + s * 15e4 });
      }
    }
  }
  save(); render(); toast('Beispieldaten geladen');
}

const toastEl = document.getElementById('toast'); let toastT;

  const hide = () => toastEl.classList.remove('show');

  toastEl.innerHTML = esc(msg) + (undo ? ' <button style="color:var(--accent-ink);font-weight:800;margin-left:10px;text-decoration:underline" id="undo">Zurück</button>' : '');
  if(undo) document.getElementById('undo').onclick = () => { undo(); hide(); };
  requestAnimationFrame(() => toastEl.classList.add('show'));

function confetti(){
  if(matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  const c = document.getElementById('confetti'), x = c.getContext('2d'), dpr = devicePixelRatio || 1;
  c.width = innerWidth * dpr; c.height = innerHeight * dpr; x.setTransform(dpr, 0, 0, dpr, 0, 0);
  const cols = ['#ff6a2b','#f5efe7','#ffb27a','#e4c9a6'];
  const ps = Array.from({ length: 70 }, () => ({ x: innerWidth/2, y: 60, vx: (Math.random()-.5)*9, vy: Math.random()*-4 - 1,
    s: 4 + Math.random()*5, a: Math.random()*6, va: (Math.random()-.5)*.4, c: cols[Math.random()*cols.length|0] }));
  let f = 0;
  (function step(){
    x.clearRect(0, 0, innerWidth, innerHeight);
    for(const p of ps){ p.vy += .22; p.vx *= .99; p.x += p.vx; p.y += p.vy; p.a += p.va;
      x.save(); x.translate(p.x, p.y); x.rotate(p.a); x.fillStyle = p.c; x.globalAlpha = Math.max(0, 1 - f/90); x.fillRect(-p.s/2, -p.s/4, p.s, p.s/2); x.restore(); }
    if(++f < 90) requestAnimationFrame(step); else x.clearRect(0, 0, innerWidth, innerHeight);
  })();
}

/* ---------- Amazfit-Uhr: heutiges Training an die Uhr, Sätze von der Uhr zurück ----------
   Brücke ist der Worker satzbuch-sync (Cloudflare). Satzbuch legt dort den Plan ab (PUT plan),
   die Uhr holt ihn über die Zepp-App und legt ihre Sätze ab, Satzbuch holt sie (GET sets) und bestätigt (POST ack).
   Kopplungscode in localStorage 'satzbuch.uhr' = { code, ok } (ok = letzter erfolgreicher Abgleich). */
var UHR_URL = 'https://satzbuch-sync.lernhirn-2026.workers.dev/api/';
var UHR_KEY = 'satzbuch.uhr';
var uhr = null, uhrLetzter = '', uhrT = null, uhrHolt = false;
try{ uhr = JSON.parse(localStorage.getItem(UHR_KEY)); if(!uhr || !/^[A-Z0-9]{8,32}$/.test(uhr.code)) uhr = null; }catch(e){ uhr = null; }
function uhrSpeichern(){ try{ uhr ? localStorage.setItem(UHR_KEY, JSON.stringify(uhr)) : localStorage.removeItem(UHR_KEY); }catch(e){} }
function uhrCodeNeu(){
  const z = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789', a = crypto.getRandomValues(new Uint8Array(10));
  return Array.from(a, x => z[x % z.length]).join('');
}
const uhrCodeZeigen = c => c.slice(0, 5) + '-' + c.slice(5);
async function uhrFetch(pfad, body){
  const opt = body ? { method: pfad === 'plan' ? 'PUT' : 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) } : {};
  const r = await fetch(UHR_URL + uhr.code + '/' + pfad, { ...opt, cache: 'no-store' });
  if(!r.ok) throw new Error('HTTP ' + r.status);
  return r.json();
}
/* Übungen fürs Uhr-Training: laufendes Training, sonst heutige Einheit(en), sonst zuletzt benutzte */
function uhrNamen(){
  let names = db.training?.ex?.length ? [...db.training.ex] : [];
  if(!names.length) for(const w of [workoutOn(new Date().getDay()), extraHeute()]) if(w) names.push(...planNamen(w));
  if(!names.length) names = exercisesSorted().slice(0, 8).map(id => db.ex[id].name);
  return [...new Set(names.map(n => n.trim()).filter(Boolean))].slice(0, 20);
}
/* Eine Übung für die Uhr: Ziel aus dem Plan, Vorschlag wie beim Eintragen am Handy (applyDefaults) */
function uhrUebung(name){
  const po = optionFor(name), id = findEx(name), slot = po && slotFor(name);
  const o = slot?.optionen.find(x => x.name.toLowerCase() === name.toLowerCase()) || po?.opt || null;
  const sec = (id && db.ex[id].unit === 'sec') || o?.einheit === 'sec';
  let w = o?.bw || (id && modeOf(id) !== 'kg' && setsOf(id).length) ? 0 : 20, r = o ? o.von : 8;
  if(id){ const s = setsOf(id); if(s.length){ const l = s[s.length-1]; w = l.w; r = l.r; } }
  const st = o && slot && steigerung(slot, o);
  if(st){ w = st.w; r = o.von; }
  const heute = id ? setsOf(id).filter(s => dayKey(s.t) === today()) : [];
  return {
    n: name, u: sec ? 'sec' : 'reps', s: o?.s || 3, von: o?.von || 0, bis: o?.bis || 0, w, r,
    p: po ? pauseSec(po.slot.pause) : (id && db.ex[id].pause) || 90,
    plus: o?.plus || (o?.bw ? 2.5 : 2.5), bw: !!(o?.bw || (id && setsOf(id).length && modeOf(id) !== 'kg')),
    done: heute.length, am: o ? amZiel(o, heute) : 0,
    hint: o ? readyFor(o, slot).replace('→', 'auf') : '',
  };
}
function uhrPlanBald(){ if(!uhr) return; clearTimeout(uhrT); uhrT = setTimeout(uhrPlanSenden, 1200); }
async function uhrPlanSenden(force){
  if(!uhr) return false;
  const tw = workoutOn(new Date().getDay()), xw = extraHeute();
  const name = db.training?.name || tw?.name || xw?.name || 'Freies Training';
  const ex = uhrNamen().map(uhrUebung);
  const kern = JSON.stringify([today(), name, ex]);
  if(!force && kern === uhrLetzter) return true;
  try{
    await uhrFetch('plan', { plan: { v: 1, t: Date.now(), tag: today(), name, ex } });
    uhrLetzter = kern; uhr.ok = Date.now(); uhrSpeichern(); return true;
  }catch(e){ return false; }
}
/* Sätze der Uhr übernehmen wie am Handy gespeichert (Training, Aufstieg, Rekorde) */
function uhrUebernehmen(liste){
  const da = new Set(db.sets.map(s => s.id)), auf = [];
  let neu = 0, pr = false;
  for(const x of liste.slice().sort((a, b) => a.t - b.t)){
    if(!x || da.has(x.id) || !String(x.n || '').trim() || !(x.r >= 1)) continue;
    const name = String(x.n).trim(), po = optionFor(name);
    let id = findEx(name);
    if(!id){ id = uid(); db.ex[id] = { name: po ? po.opt.name : name, created: x.t }; if(po?.opt.einheit === 'sec') db.ex[id].unit = 'sec'; }
    if(!db.ex[id].gruppe && po) db.ex[id].gruppe = po.slot.gruppe;
    const frisch = Date.now() - x.t < 4 * 36e5;
    if(!db.training && frisch) trainingStarten(heutigeEinheit(name)?.id, true);
    if(db.training && frisch){
      if(x.t < db.training.start) db.training.start = x.t;
      zumTraining([db.ex[id].name]);
    }
    const set = { id: x.id, ex: id, w: +x.w || 0, r: Math.round(x.r), t: x.t };
    db.sets.push(set); da.add(x.id); neu++;
    if(dayKey(x.t) === today()) auf.push(...pruefeAufstieg(db.ex[id].name, id));
    if(prIds(id).has(set.id)) pr = true;
  }
  if(!neu) return 0;
  save(); uhrZeigen();
  if(auf.length){ navigator.vibrate?.([20, 60, 20]); toast('Stufe geschafft 🎉 (Uhr)', true); confetti(); }
  else if(pr){ toast('Neuer Rekord 🎉 (Uhr)', true); confetti(); }
  else toast(neu === 1 ? '⌚ 1 Satz von der Uhr' : `⌚ ${neu} Sätze von der Uhr`);
  render();
  try{ if(sheetOpen && log && document.getElementById('todayList')) syncLog(); }catch(e){}
  return neu;
}
async function uhrHolen(){
  if(!uhr || uhrHolt || document.hidden) return;
  uhrHolt = true;
  try{
    const { sets } = await uhrFetch('sets');
    if(sets?.length){
      uhrUebernehmen(sets);
      await uhrFetch('ack', { ids: sets.map(s => s.id) });
    }
    uhr.ok = Date.now(); uhrSpeichern();
    uhrPlanBald();
  }catch(e){}
  finally{ uhrHolt = false; }
}
function openUhr(){
  const schritte = `<ol class="info" style="text-align:left;line-height:1.55;padding-left:20px;margin:14px 0 0">
      <li>Uhr-App <b>Satzbuch</b> auf der Uhr installieren.</li>
      <li>Zepp-App öffnen → <b>Profil</b> → deine Uhr → <b>App-Liste</b> → <b>Satzbuch</b> → Einstellungen.</li>
      <li>Diesen Code eintragen. Danach auf der Uhr Satzbuch öffnen.</li>
    </ol>`;
  const stand = uhr?.ok ? `Zuletzt abgeglichen: ${relDay(dayKey(uhr.ok))}, ${fmtUhrzeit(uhr.ok)}` : 'Noch nicht abgeglichen';
  openSheet(`<div class="sheet-head"><h2>Amazfit-Uhr</h2><button class="iconbtn" id="closeBtn" aria-label="Schließen">${I.x}</button></div>
    ${uhr ? `<p class="info" style="text-align:center;margin:4px 0 6px">Kopplungscode</p>
      <p class="num" style="text-align:center;font-size:34px;font-weight:800;letter-spacing:3px;margin:0;user-select:all">${uhrCodeZeigen(uhr.code)}</p>
      ${schritte}
      <p class="info" style="text-align:center;margin-top:14px">${stand}</p>
      <div class="menu" style="margin-top:12px">
        <button id="uhrSync">Jetzt abgleichen<small>Heutiges Training an die Uhr, Sätze von der Uhr holen</small></button>
        <button id="uhrAus" class="danger">Entkoppeln<small>Die Uhr bekommt keine Daten mehr</small></button>
      </div>`
    : `<p class="info" style="margin-top:4px">Die Uhr zeigt dein heutiges Training mit Ziel und vorgeschlagenem Gewicht. Sätze, die du dort abhakst, landen automatisch hier, mit Progression und Rekorden. Übertragen wird über einen kleinen Gratis-Speicher (nur dein Training, kein Name, kein Login).</p>
      <div class="menu" style="margin-top:12px"><button id="uhrAn">Uhr koppeln<small>Erstellt einen Kopplungscode für die Zepp-App</small></button></div>`}`);
  document.getElementById('closeBtn').onclick = () => closeSheet();
  const an = document.getElementById('uhrAn');
  if(an) an.onclick = async () => { uhr = { code: uhrCodeNeu(), ok: 0 }; uhrSpeichern(); uhrLetzter = ''; await uhrPlanSenden(true); openUhr(); };
  const sy = document.getElementById('uhrSync');
  if(sy) sy.onclick = async () => {
    sy.disabled = true; await uhrHolen(); const ok = await uhrPlanSenden(true);
    toast(ok ? 'Abgeglichen ✓' : 'Keine Verbindung'); openUhr();
  };
  const aus = document.getElementById('uhrAus');
  if(aus) aus.onclick = () => {
    if(!confirm('Uhr entkoppeln? Auf der Uhr musst du danach einen neuen Code eintragen.')) return;
    uhr = null; uhrSpeichern(); closeSheet(); toast('Uhr entkoppelt');
  };
}
setInterval(uhrHolen, 10000);
document.addEventListener('visibilitychange', () => { if(!document.hidden) uhrHolen(); });

/* Training vergessen zu stoppen: nach 4 Stunden ohne Satz von selbst beenden */
function trainingAufraeumen(){
  const tr = db.training; if(!tr) return;
  const s = trainingSaetze(tr), zuletzt = Math.max(tr.start, ...s.map(x => x.t));
  if(Date.now() - zuletzt < 4 * 36e5) return;
  const rec = trainingBeenden(true);
  render(); if(rec) setTimeout(() => toast(`Training von ${relDay(dayKey(rec.start))} automatisch beendet`), 400);
}
trainingAufraeumen();
document.addEventListener('visibilitychange', () => { if(!document.hidden){ trainingAufraeumen(); uhrZeigen(); } });
render();
uhrLaeuft();
/* Laufende Pause nach dem Neuladen fortsetzen */
if(rest){ if(rest.end > Date.now()) restTick = setInterval(updateTimerUI, 250); else { rest = null; saveRest(); } }
updateTimerUI();
uhrHolen();
if('serviceWorker' in navigator && location.protocol !== 'file:') navigator.serviceWorker.register('sw.js').catch(() => {});
</script>
